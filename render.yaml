services:
  # ============================================================
  # SIHFLOW ERP PRODUCTION FULL-STACK SERVICE (API + REACT SPA)
  # ============================================================
  - type: web
    name: sihflow-erp
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: GITHUB_REPO_URL
        value: "https://github.com/vishanth11/AcadShield.git"
      - key: DATABASE_URL
        fromDatabase:
          name: sihflow-db
          property: connectionString

databases:
  # ============================================================
  # FREE MANAGED POSTGRESQL DATABASE
  # ============================================================
  - name: sihflow-db
    plan: free
    region: oregon
    databaseName: sihflow_db
    user: sihflow
