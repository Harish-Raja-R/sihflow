version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sihflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sihflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sihflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sihflow-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/sihflow_db?schema=public
      JWT_SECRET: sihflow-super-secret-jwt-key-2026-sih
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: sihflow-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local
